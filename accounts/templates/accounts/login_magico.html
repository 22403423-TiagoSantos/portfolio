{% extends 'base.html' %}
{% block content %}
<h3>Entrar com Link Mágico</h3>
<form method="post">
    {% csrf_token %}
    <p>Email: <input type="email" name="email" required></p>
    <button type="submit">Enviar Link</button>
</form>
<p><a href="{% url 'accounts:login' %}">Voltar ao login normal</a></p>
{% endblock %}
