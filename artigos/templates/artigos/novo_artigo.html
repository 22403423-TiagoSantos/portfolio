{% extends 'portfolio/base.html' %}

{% block content %}
<div style="padding: 20px; max-width: 600px; margin: auto;">
    <h2>Publicar Novo Artigo</h2>
    
    <form method="post" enctype="multipart/form-data"> 
        {% csrf_token %}
        
        <div style="margin-bottom: 15px;">
            {{ form.as_p }}
        </div>
        
        <button type="submit" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Publicar Artigo
        </button>
        <a href="{% url 'artigos:lista' %}" style="margin-left: 15px; color: #666;">Cancelar</a>
    </form>
</div>
{% endblock %}
