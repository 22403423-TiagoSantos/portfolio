{% extends 'base.html' %} {% block main %}
<h3>Login</h3>
{% if mensagem %}
    <p style="color: red;">{{ mensagem }}</p>
{% endif %}
<form action="" method="post">
    {% csrf_token %}
    <p>Username: <input type="text" name="username"></p>
    <p>Password: <input type="password" name="password"></p>
    <input type="submit" value="Login">
</form>
{% endblock %}
