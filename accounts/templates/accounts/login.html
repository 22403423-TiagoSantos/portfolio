{% extends 'portfolio/base.html' %} 

{% block content %} 
<div style="padding: 20px; max-width: 400px; margin: auto;">
    <h3>Login</h3>

    {% if mensagem %}
    <p style="color: red;">{{ mensagem }}</p>
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}
        <p>Username: <br> <input type="text" name="username" style="width: 100%;"></p>
        <p>Password: <br> <input type="password" name="password" style="width: 100%;"></p>
        
        <input type="submit" value="Entrar" style="background: #333; color: white; padding: 10px 20px; border: none; cursor: pointer;">
        
        <hr>
        <p>Ou, se preferir, entre sem password:</p>
        <a href="{% url 'accounts:solicitar_link' %}" class="btn-link-magico" style="text-decoration: underline; color: blue;">
            Receber Link Mágico por Email
        </a>
    </form>
</div>
{% endblock %}
