{% extends 'portfolio/base.html' %}

{% block content %}
    <h1>Os Meus Projetos</h1>
    
    <a href="{% url 'portfolio:novo_projeto' %}" style="display: inline-block; margin-bottom: 20px; padding: 10px; background: #4CAF50; color: white; text-decoration: none; border-radius: 5px;">
        + Inserir Novo Projeto
    </a>

    <ul>
        {% for projeto in projetos %}
            <li style="margin-bottom: 30px;">
                <h2>{{ projeto.nome }}</h2>
                <p>{{ projeto.descricao }}</p>
                {% if projeto.imagem %}
                    <img src="{{ projeto.imagem.url }}" width="300">
                {% endif %}
                
                <br>
                <a href="{% url 'portfolio:edita_projeto' projeto.id %}" style="padding: 5px 10px; background: #2196F3; color: white; text-decoration: none; border-radius: 3px;">✏️ Editar</a>
                
                <a href="{% url 'portfolio:apaga_projeto' projeto.id %}" style="padding: 5px 10px; background: #f44336; color: white; text-decoration: none; border-radius: 3px; margin-left: 10px;" onclick="return confirm('Tens a certeza que queres apagar este projeto?')">🗑️ Apagar</a>
            </li>
            <hr>
        {% endfor %}
    </ul>
{% endblock %}
